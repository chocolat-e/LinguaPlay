<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Punch English — a Beat Saber inspired rhythm boxing game for learning English."
    />
    <title>PUNCH ENGLISH</title>

    <!-- Display faces. If the network is unavailable the CSS stack falls back
         to system fonts and the game still looks right. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before the bundle loads so there is never a white flash. */
      html,
      body {
        margin: 0;
        background: #04030f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
